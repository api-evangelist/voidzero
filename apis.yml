name: VoidZero
description: >-
  VoidZero is the JavaScript tooling company building a unified, high-performance
  open-source toolchain for web development: the build tool Vite, the test runner
  Vitest, the Rust-based bundler Rolldown, and the Oxc language toolchain (including
  the oxlint linter and oxc-parser), all brought together under the commercial
  unified entry point Vite+. Founded by Evan You, creator of Vite and Vue.js, and
  backed by Accel and Peak XV, VoidZero joined Cloudflare in 2026. The company
  ships its capabilities as open-source npm packages and command-line tools rather
  than as a hosted REST API.
